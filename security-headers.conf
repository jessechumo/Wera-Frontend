# Security headers for the app's own responses, included by each static
# location in nginx.conf (an add_header inside a location drops any
# server-level ones). /api responses carry the API's stricter headers.
#
# CSP: everything is first-party. Scripts load only from this origin (no
# inline scripts: the theme bootstrap is /theme-init.js); styles allow
# inline for the print view and component styles; the app talks only to
# its own /api; nothing may frame it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Browsers ignore HSTS over plain HTTP, so this only takes effect once the
# site is served over HTTPS (behind the tunnel or a TLS proxy); from then
# on browsers refuse to downgrade to HTTP, which blocks SSL stripping.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
