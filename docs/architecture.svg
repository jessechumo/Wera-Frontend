<text x="32" y="44" font-size="20" font-weight="700" fill="#1F2328">Wera web: frontend architecture</text>
<text x="32" y="66" font-size="12.5" fill="#57606A">A React single-page app. Every call goes to its own origin (/api), so it runs the same behind Vite, nginx or Vercel.</text>
