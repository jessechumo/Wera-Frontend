<text x="475" y="441" font-size="14" font-weight="650" fill="#1F2328">API client</text>
<text x="475" y="456" font-size="10.5" font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E7C86">src/api/client.ts</text>
<text x="435" y="476" font-size="11.5" fill="#57606A">same-origin fetch, cookie session</text>
<text x="435" y="492" font-size="11.5" fill="#57606A">errors become ApiError(status, msg)</text>
<text x="435" y="508" font-size="11.5" fill="#57606A">401 anywhere → signed out → /login</text>
<text x="435" y="524" font-size="11.5" fill="#57606A">no tokens in JS, no third parties</text>
