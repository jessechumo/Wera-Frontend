<text x="435" y="332" font-size="11.5" fill="#57606A">Prose: safe markdown, no HTML</text>
<text x="435" y="348" font-size="11.5" fill="#57606A">Reactions (optimistic), FilterBar</text>
<text x="435" y="364" font-size="11.5" fill="#57606A">Switch, toasts, charts</text>
