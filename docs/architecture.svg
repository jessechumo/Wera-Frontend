<text x="900" y="161" font-size="14" font-weight="650" fill="#1F2328">nginx (or Vercel)</text>
<text x="900" y="176" font-size="10.5" font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#D9572B">dist/ · self-hosted fonts</text>
<text x="860" y="196" font-size="11.5" fill="#57606A">hashed assets cached for a year</text>
<text x="860" y="212" font-size="11.5" fill="#57606A">index.html revalidated on each load</text>
<text x="860" y="228" font-size="11.5" fill="#57606A">/api proxied to the API</text>
<text x="860" y="244" font-size="11.5" fill="#57606A">strict CSP, HSTS, no framing</text>
