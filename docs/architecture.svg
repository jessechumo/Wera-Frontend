<text x="108" y="456" font-size="10.5" font-family="'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E7C86">@tanstack/react-query</text>
<text x="68" y="476" font-size="11.5" fill="#57606A">TanStack Query cache per endpoint</text>
<text x="68" y="492" font-size="11.5" fill="#57606A">polls Today while scores arrive</text>
<text x="68" y="508" font-size="11.5" fill="#57606A">optimistic updates, invalidation</text>
<text x="68" y="524" font-size="11.5" fill="#57606A">sign-out clears it in place</text>
