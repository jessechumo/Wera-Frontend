server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Hashed assets are immutable: cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API + health go to the Go service (compose network name).
    location /api/ {
        proxy_pass http://wera-api:8080;
        # $http_host keeps the port, so it matches the browser's Origin
        # (the API refuses state-changing requests from other origins).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /healthz {
        proxy_pass http://wera-api:8080;
    }

    # SPA fallback: every other path renders the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
