server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Resumes are up to 5 MiB (the API enforces exact limits); nginx's
    # default of 1 MiB would refuse larger uploads before they arrive.
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Hashed assets are immutable: cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Look the API up through Docker's DNS on each request (cached 10s):
    # a fixed proxy_pass host is resolved once at startup, so recreating
    # the API container (new IP) left every /api call with a 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://wera-api:8080;

    # API + health go to the Go service (compose network name).
    location /api/ {
        proxy_pass $api;
        # $http_host keeps the port, so it matches the browser's Origin
        # (the API refuses state-changing requests from other origins).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /healthz {
        proxy_pass $api;
    }

    # SPA fallback: every other path renders the app.
    location / {
        # The app shell must revalidate so a deploy is picked up at once.
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
